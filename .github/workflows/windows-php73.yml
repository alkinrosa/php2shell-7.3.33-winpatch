name: Windows PHP 7.3 fixes (TS, VC15, x64)

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Вариант патча"
        type: choice
        options:
          - remicollet
          - enhanced
          - minimal
        default: remicollet
      scope:
        description: "changed = только измененные бинарники, all = все бинарники"
        type: choice
        options:
          - changed
          - all
        default: changed

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Disable CRLF conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Install VS 2017 Build Tools (VC15)
        shell: pwsh
        run: |
          choco install visualstudio2017buildtools visualstudio2017-workload-vctools -y --no-progress
          if ($LASTEXITCODE -eq 3010) { exit 0 }

      - name: Get PHP SDK
        run: git clone --depth 1 --branch php-sdk-2.2.0 https://github.com/php/php-sdk-binary-tools.git C:\php-sdk

      - name: Download PHP 7.3 dependencies
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $base = 'https://downloads.php.net/~windows/php-sdk/deps'
          $deps = 'C:\php-build\deps'
          $tmp  = 'C:\php-build\deps-zip'
          New-Item -ItemType Directory -Force -Path $deps, $tmp | Out-Null
          $list = (Invoke-WebRequest -UseBasicParsing "$base/series/packages-7.3-vc15-x64-stable.txt").Content -split "`r?`n" | Where-Object { $_.Trim() -ne '' }
          foreach ($name in $list) {
            $name = $name.Trim()
            $zip = Join-Path $tmp $name
            Write-Host "Downloading $name"
            Invoke-WebRequest -UseBasicParsing -Uri "$base/vc15/x64/$name" -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $deps -Force
          }
          if (-not (Test-Path "$deps\include\openssl\ssl.h")) { throw 'Unexpected deps layout: include\openssl\ssl.h not found' }

      - name: Build
        shell: cmd
        run: C:\php-sdk\phpsdk-starter.bat -c vc15 -a x64 -t %GITHUB_WORKSPACE%\win\build-php73.bat --task-args "${{ inputs.variant }} ${{ inputs.scope }}"

      - name: Verify build result
        shell: cmd
        run: if not exist C:\php-build\BUILD_OK (echo Build script failed, see the Build step log & exit /b 1)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: php-7.3.33-${{ inputs.variant }}-${{ inputs.scope }}-VC15-x64-TS
          path: C:\php-build\dist\
          if-no-files-found: error
