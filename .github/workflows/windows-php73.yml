name: Windows PHP 7.3 VC15 x64

on:
  workflow_dispatch:
    inputs:
      variant:
        description: "Вариант патча"
        type: choice
        options:
          - remicollet
          - enhanced
          - minimal
        default: remicollet
      mode:
        description: "modphp = TS + php7apache2_4.dll, fcgid = NTS + php-cgi.exe"
        type: choice
        options:
          - modphp
          - fcgid
        default: modphp

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - name: Disable CRLF conversion
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4

      - name: Install VS 2017 Build Tools (VC15)
        shell: pwsh
        run: |
          choco install visualstudio2017buildtools visualstudio2017-workload-vctools -y --no-progress
          if ($LASTEXITCODE -eq 3010) { exit 0 }

      - name: Get PHP SDK and point it to the new deps server
        shell: pwsh
        run: |
          git clone --depth 1 --branch php-sdk-2.2.0 https://github.com/php/php-sdk-binary-tools.git C:\php-sdk
          if ($LASTEXITCODE -ne 0) { throw 'git clone of php-sdk failed' }
          $f = 'C:\php-sdk\lib\php\libsdk\SDK\Config.php'
          $c = [IO.File]::ReadAllText($f)
          $c = $c.Replace("'windows.php.net'", "'downloads.php.net'")
          $c = $c.Replace('"/downloads/php-sdk/deps"', '"/~windows/php-sdk/deps"')
          $c = $c.Replace(',/packages-(.+)', ',packages-(.+)')
          [IO.File]::WriteAllText($f, $c)
          if (-not (Select-String -Path $f -SimpleMatch "'downloads.php.net'")) { throw 'SDK host patch failed' }
          if (-not (Select-String -Path $f -SimpleMatch '"/~windows/php-sdk/deps"')) { throw 'SDK base URI patch failed' }
          if (-not (Select-String -Path $f -SimpleMatch ',packages-(.+)')) { throw 'SDK regex patch failed' }

      - name: Build
        shell: cmd
        run: C:\php-sdk\phpsdk-starter.bat -c vc15 -a x64 -t %GITHUB_WORKSPACE%\win\build-php73.bat --task-args "${{ inputs.variant }} ${{ inputs.mode }}"

      - name: Verify build result
        shell: cmd
        run: if not exist C:\php-build\BUILD_OK (echo Build script failed, see the Build step log & exit /b 1)

      - uses: actions/upload-artifact@v4
        with:
          name: php-7.3-${{ inputs.variant }}-${{ inputs.mode }}-Win32-VC15-x64
          path: C:\php-build\src\x64\Release*\php-*.zip
          if-no-files-found: error
